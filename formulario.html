<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="formstyle.css">
    <title>Formulario</title>
</head>

<body>
    <div class="voltar">
        <img src="imgs/Chat-image.png" width="75px">
        <a href="index.html">Página inicial</a>
    </div>
    <div class="container">
        <form id="meuForm" action="dashboard.html" enctype="multipart/form-data" class="caix-form"> <!-- O enctype="multipart/form-data" é obrigatório em form que possui um campo do type=file -->
            <h2>Preencha o formulário</h2>
            <label for="titulo" class="text-input">Titulo:<span color="red">*</span></label>
            <input type="text" id="titulo" name="name" placeholder="Titulo" required class="inputs">

            <label for="image" class="text-input">Foto do fato:<span color="red">*</span></label>
            <input type="file" id="image" name="img" accept="image/*" required class="inputs">

            <label for="local" class="text-input">Rua<span color="red">*</span></label>
            <input type="text" id="local" name="local" required class="inputs" placeholder="N° e nome da rua..">

            <p class="p-aviso">Preencha todos os campos obrigatórios para solucionar o problema o mais rápido possível.
            </p>

            <button type="submit" class="btn-enviar" onclick="cliqueiBotao()">Publicar</button>
        </form>

    </div>

</body>
<script src="scriptForm.js"></script>

</html>
